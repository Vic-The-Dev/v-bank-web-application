{% extends "base.html" %}

{% block title %}Withdraw | V-Bank{% endblock %}

{% block content %}

<div class="form-container">
    <div class="form-header">
        <h1>Withdraw Money</h1>
        <p>Withdraw money from your V-Bank account.</p>
    </div>

    <form method="POST" action="{{ url_for('withdrawal') }}"
          data-loading-text="Processing your withdrawal...">

        <div class="form-group">
            <label for="amount">Amount (₦)</label>
            <input
                type="number"
                id="amount"
                name="amount"
                min="200"
                max="1000"
                step="0.01"
                placeholder="₦200 - ₦1,000"
                required
            >
        </div>

        <div class="form-group">
            <label for="pin">Transaction PIN</label>
            <input
                type="password"
                id="pin"
                name="pin"
                maxlength="4"
                inputmode="numeric"
                pattern="[0-9]{4}"
                placeholder="Enter your 4-digit PIN"
                required
            >
        </div>

        <button type="submit" class="btn-primary">
            Withdraw Money
        </button>

    </form>
</div>

{% endblock %}
