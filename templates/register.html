{% extends "base.html" %}

{% block title %}
V-bank | Register
{% endblock %}

{% block content %}


<form method="POST" action="{{ url_for('register') }}"
      data-loading-text="Creating your account...">

    <label for="first_name">First name</label>
    <input type="text" id="first_name" name="first_name"
           placeholder="John" required>

    <label for="last_name">Last name</label>
    <input type="text" id="last_name" name="last_name"
           placeholder="Doe" required>
    <br>

    <label for="email">E-mail</label>
    <input type="email" id="email" name="email"
           placeholder="john_doe@gmail.com" required>

    <label for="phone">Phone</label>
    <input type="tel" name="phone" id="phone"
           placeholder="081xxxxxxx9">
    <br>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" 
           placeholder="Set Password" required>

    <label for="check_password">Confirm Password</label>
    <input type="password" id="check_password" name="check_password"
           placeholder="Confirm Password" required>
    <br>
    
    <label for="pin">Set up 4-digit pin</label>
    <input type="password" id="pin" name="pin" 
           placeholder="Enter 4-digit PIN" maxlength="4"
           minlength="4" pattern="[0-9]{4}" inputmode="numeric" required>

    <label for="confirm_pin">Confirm Transaction PIN</label>
    <input type="password" id="confirm_pin" name="confirm_pin"
           placeholder="Confirm 4-digit PIN" maxlength="4"
           minlength="4" pattern="[0-9]{4}" inputmode="numeric" required>

    <button type="submit">Register</button>

</form>

{% endblock %}
