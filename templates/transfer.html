{% extends "base.html" %}

{% block title %}Transfer Money - V-Bank{% endblock %}

{% block content %}

<div class="form-container">
    <h2>Transfer Money</h2>
    <p>Send money to another V-Bank account.</p>

    <form method="POST" data-loading-text="Processing your transfer...">

        <div class="form-group">
            <label for="account_number">Recipient Account Number</label>
            <input
                type="text"
                id="account_number"
                name="account_number"
                maxlength="10"
                pattern="[0-9]{10}"
                placeholder="Enter 10-digit account number"
                required
            >
        </div>

        <div class="form-group">
            <label for="amount">Amount (₦)</label>
            <input
                type="number"
                id="amount"
                name="amount"
                min="200"
                max="1000"
                step="0.01"
                placeholder="₦200 - ₦1,000"
                required
            >
        </div>

        <div class="form-group">
            <label for="pin">Transaction PIN</label>
            <input
                type="password"
                id="pin"
                name="pin"
                maxlength="4"
                pattern="[0-9]{4}"
                inputmode="numeric"
                placeholder="Enter your 4-digit PIN"
                required
            >
        </div>

        <button type="submit">Transfer Money</button>

    </form>
</div>

{% endblock %}
