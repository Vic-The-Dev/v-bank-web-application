{% extends "base.html" %}

{% block title %}Deposit | V-Bank{% endblock %}

{% block content %}

<div class="form-container">
    <div class="form-header">
        <h1>Deposit Money</h1>
        <p>Add money to your V-Bank account.</p>
    </div>

    <form method="POST" action="{{ url_for('deposit') }}"
          data-loading-text="Processing your deposit...">

        <div class="form-group">
            <label for="amount">Amount (₦)</label>

            <input
                type="number"
                id="amount"
                name="amount"
                min="1000"
                max="9999999999999.99"
                step="0.01"
                placeholder="Minimum deposit: ₦1,000"
                required
            >
        </div>

        <div class="form-group">
            <label for="pin">Transaction PIN</label>
            <input
                type="password"
                id="pin"
                name="pin"
                maxlength="4"
                inputmode="numeric"
                pattern="[0-9]{4}"
                placeholder="Enter your 4-digit PIN"
                required
            >
        </div>

        <button type="submit" class="btn-primary">
            Deposit Money
        </button>

    </form>
</div>

{% endblock %}
